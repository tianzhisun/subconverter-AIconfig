; Local OpenClash template - BWH PRIVATE
; Based on local_geosite_geoip_lite_openclash_slim.ini
; Simplified for one private BWH VPS with two protocols.
;
; Design:
; 1) BWH-DC9-Reality is primary.
; 2) BWH-DC9-AnyTLS is automatic fallback.
; 3) Only two user-facing routing groups are retained: Proxy and Direct.
; 4) Ads/App-clean rules use Mihomo built-in REJECT directly; no extra group.
;
[custom]
; ======================
; Proxy groups
; ======================

custom_proxy_group=♻️ BWH故障切换`fallback`[]BWH-DC9-Reality`[]BWH-DC9-AnyTLS`https://www.gstatic.com/generate_204`300
custom_proxy_group=🚀 代理`select`[]♻️ BWH故障切换`[]BWH-DC9-Reality`^(?!BWH-DC9-Reality$)BWH-DC9-.*`[]🎯 全球直连
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; ======================
; Rules - keep this section compact to avoid SubConverter-Extended LAN profile rule limit
; ======================
ruleset=🎯 全球直连,[]GEOSITE,private

ruleset=🎯 全球直连,[]IP-CIDR,144.34.146.222/32,no-resolve

